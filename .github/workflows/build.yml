name: Build & Push Images

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the values.yaml tag bump back to master
      packages: write

    env:
      BACKEND_IMAGE: ghcr.io/mrashed98/xtreme-downloader-backend
      FRONTEND_IMAGE: ghcr.io/mrashed98/xtreme-downloader-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the chart to this immutable commit so ArgoCD sees a real diff and rolls.
      # GITHUB_TOKEN-authored pushes don't retrigger workflows, so this can't loop.
      - name: Pin image tags to this commit
        run: |
          sed -i "s|tag: .*|tag: ${GITHUB_SHA}|" helm/xtreme-downloader/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/xtreme-downloader/values.yaml
          git commit -m "ci: pin images to ${GITHUB_SHA} [skip ci]" || { echo "no change"; exit 0; }
          git push
